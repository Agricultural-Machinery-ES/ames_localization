navsat_transform_node:
  ros__parameters:
    # 是否发布“地理投影坐标系 <-> 世界坐标系”的变换
    # 这个不是 map->odom 主TF，而是给GPS转换过程用的辅助TF
    broadcast_cartesian_transform: true

    # 如果为 true，则 cartesian/utm 作为父坐标系
    # 如果为 false，则 world_frame 作为父坐标系
    broadcast_cartesian_transform_as_parent_frame: false

    # 指定固定基准点（datum）
    # [latitude, longitude, yaw]；第三项是地图相对 ENU/UTM 的 yaw，不是海拔。
    # 有了它，GPS 经纬度会相对这个参考点转换成平面坐标
    datum:
      - 32.0448545816   # latitude
      - 118.874397795   # longitude
      - 0.0             # yaw [rad]

    # 启动后等待若干秒再开始处理，避免一开始 TF/传感器还没准备好
    delay: 0.5

    # 节点输出频率
    frequency: 20.0

    # 磁偏角（弧度）
    # 如果 IMU 的 yaw 是相对磁北，需要填磁偏角修正到真北
    # 如果 IMU 已经是地图系/东北天系，通常填 0
    magnetic_declination_radians: 0.0

    # 是否发布融合后的 GPS（把滤波后的平面坐标再转回经纬度）
    publish_filtered_gps: true

    # 查询 TF 的等待时间
    transform_timeout: 1.0

    # false: 使用全局投影坐标（通常类似 UTM/cartesian）
    # true : 使用局部笛卡尔坐标（local cartesian / ENU）
    use_local_cartesian: false

    # false: 航向角从 IMU 来
    # true : 航向角从 odometry 来
    use_odometry_yaw: true

    use_sim_time: false

    # true: 必须等 datum 就绪后才开始工作
    wait_for_datum: true

    # yaw 额外补偿项（弧度）
    # 如果 IMU 朝向定义和 ENU/地图系有固定偏差，可以在这里修
    yaw_offset: 0.0

    # 是否把高度强行置 0
    # 对 2D 地面机器人通常建议 true
    zero_altitude: true

local_ekf_node:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    predict_to_current_time: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    transform_timeout: 0.5

    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    imu0: /imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  true,  true]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10

global_ekf_node:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    predict_to_current_time: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map
    transform_timeout: 0.5

    # 只把局部 EKF 的连续运动信息继续传给全局 EKF，
    # 全局绝对位置仍然由 odometry/gps 提供，避免把两层职责混在一起。
    odom0: /odometry/local
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    imu0: /imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  true,  true]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10

    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10
