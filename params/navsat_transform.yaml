navsat_transform_node:
  ros__parameters:
    # --- 坐标变换配置 ---
    # 是否发布 GPS 投影系(UTM/Cartesian)与世界系(Map)之间的 TF
    broadcast_cartesian_transform: true
    # false 表示 Map 是父级（Map -> UTM）；true 表示 UTM 是父级（UTM -> Map）
    broadcast_cartesian_transform_as_parent_frame: false
    
    # --- 地图原点 (Datum) ---
    # 预设地图零点经纬度 [纬度, 经度, 海拔]
    datum: [31.62132975, 119.1805795, 0.0]
    # 必须等待收到 datum 后才开始处理 GPS 数据
    wait_for_datum: true

    # --- 算法逻辑控制 ---
    # 使用局部笛卡尔坐标系(ENU)而非全球 UTM 坐标
    use_local_cartesian: false
    # 优先使用里程计提供的偏航角(Yaw)进行经纬度对齐，而非直接使用 IMU
    use_odometry_yaw: true
    # 地面机器人强制将高度设为 0，防止 Z 轴漂移
    zero_altitude: true

    # --- 修正参数 ---
    # 磁偏角补偿：若 IMU 未补偿磁北与真北差异则需填写（弧度）
    magnetic_declination_radians: 0.0
    # 坐标系偏置：修正 IMU 安装角或坐标系定义的额外偏差
    yaw_offset: 0.0

    # --- 输出与频率 ---
    frequency: 30.0
    delay: 3.0
    transform_timeout: 0.0
    # 发布经过滤波修正后的经纬度话题 (/gps/filtered)
    publish_filtered_gps: true
    use_sim_time: false

global_ekf_node:
  ros__parameters:
    # --- 核心设置 ---
    frequency: 10.0
    # 2D 模式：强制忽略 Z, Roll, Pitch 及其速度/加速度，适合地面移动
    two_d_mode: true
    publish_acceleration: false
    # 强制将机器人位姿推算至当前系统时间，确保 TF 变换实时同步，防止导航因数据延迟报错
    predict_to_current_time: true

    # --- TF 树结构 ---
    # 全局 EKF：负责维护 map -> odom 的变换
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # --- 传感器输入配置说明 ---
    # 矩阵格式：[x, y, z, roll, pitch, yaw, vx, vy, vz, v_roll, v_pitch, v_yaw, ax, ay, az]

    # [输入 0]：局部里程计 (编码器/视觉)
    # 逻辑：仅使用其“横向/纵向速度”和“角速度”，不使用其易漂移的绝对位姿
    odom0: /odom
    odom0_config: [false, false, false, # Position
                   false, false, false, # Orientation
                   true,  false, false, # Linear Velocity (vx)
                   false, false, true,  # Angular Velocity (vyaw)
                   false, false, false] # Acceleration

    # [输入 1]：IMU 数据
    # 逻辑：提供绝对偏航角(Yaw)和角速度(v_yaw)以修正航向
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,  # Orientation (yaw)
                  false, false, false,
                  false, false, true,  # Angular Velocity (vyaw)
                  false, false, false]

    # [输入 2]：GPS 转换后的里程计 (由 navsat_transform_node 输出)
    # 逻辑：提供全局绝对位置 (x, y)，防止累积误差
    odom1: /odometry/gps
    odom1_config: [true,  true,  false, # Position (x, y)
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]