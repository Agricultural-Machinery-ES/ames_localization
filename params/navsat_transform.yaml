navsat_transform_node:
  ros__parameters:
    # 是否广播经纬度原点到 Cartesian (通常是 map) 的变换
    broadcast_cartesian_transform: true
    # 是否将 Cartesian 坐标系作为父坐标系 (通常选 false，维持 map -> utm/cartesian 逻辑)
    broadcast_cartesian_transform_as_parent_frame: false
    # 静态原点：定义 map 坐标系的零点对应的经纬度
    datum:
      - 31.62132975   # 纬度 latitude
      - 119.1805795   # 经度 longitude
      - 0.0           # 海拔 altitude
    delay: 3.0        # 节点启动后等待传感器数据的延迟时间
    frequency: 15.0
    magnetic_declination_radians: 0.0  # 磁偏角，若 IMU 已在外部补偿则设为 0
    publish_filtered_gps: true        # 发布经过滤波后的经纬度数据 (sensor_msgs/NavSatFix)
    transform_timeout: 0.0
    use_local_cartesian: false        # 使用 UTM 投影而非 Local Cartesian
    use_odometry_yaw: true            # 使用 EKF 输出的朝向来计算 GPS 坐标，通常比直接用 IMU 更稳定
    wait_for_datum: true              # 强制等待 datum 参数加载
    yaw_offset: 0.0                   # IMU 0位与正东方向的夹角偏移 (ROS 标准是 0 对应东)
    zero_altitude: true               # 强制高度为 0，适用于 2D 导航

global_ekf_node:
  ros__parameters:
    frequency: 15.0
    two_d_mode: true                  # 仅处理 X, Y, Yaw
    publish_acceleration: false
    predict_to_current_time: false
    map_frame: map                    # 全局坐标系
    odom_frame: odom                  # 局部连续坐标系
    base_link_frame: base_link
    world_frame: map                  # Global EKF 必须将 world_frame 设为 map
    
    # 局部里程计 (Wheel Odom)
    odom0: /odom
    odom0_config: [false, false, false, 
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    
    # 惯性测量单元 (IMU)
    imu0: /imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,   # Roll, Pitch, Yaw (绝对姿态)
                  false, false, false,
                  true,  true,  true,   # 角速度
                  true,  true,  true]   # 线加速度

    # GPS 转换后的全局观测 (由 navsat_transform_node 发布)
    odom1: /odometry/gps
    odom1_config: [true,  true,  false, # X, Y (来自 GPS 的绝对位置)
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false           # GPS 必须提供绝对位置，不可开启微分模式