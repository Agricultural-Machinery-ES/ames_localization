    base_link_frame: base_link
    world_frame: map
    odom0: /odom
    odom0_config: [false, false, false, 
                   false, false, false, 
                   true,  false, false, 
                   false, false, true,  
                   false, false, false] 
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,  
                  false, false, false,
                  false, false, true,  
                  false, false, false]
    odom1: /odometry/gps
    odom1_config: [true,  true,  false, 
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]