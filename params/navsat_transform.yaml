navsat_transform_node:
  ros__parameters:
    # 是否发布“笛卡尔坐标系”辅助变换。
    # 这里打开后，navsat_transform 会向外提供 world_frame 与 UTM/本地笛卡尔坐标之间的静态辅助 TF，
    # 方便把经纬度观测稳定地转换到地图坐标系中。
    broadcast_cartesian_transform: true

    # 是否把上面的笛卡尔辅助 TF 作为父坐标系发布。
    # 保持 false 时，通常更符合以 world/map 为主坐标系的配置习惯。
    broadcast_cartesian_transform_as_parent_frame: false

    # 手动 datum 基准点，格式为 [latitude, longitude, yaw]。
    # - latitude: 纬度，单位是度
    # - longitude: 经度，单位是度
    # - yaw: 地图相对 ENU/UTM 的初始朝向，单位是弧度，不是高度
    # 仅在启用手动 datum 模式时使用；当前自动基准模式下不会采用这组值。
    datum:
      # 基准点纬度。
      - 31.62132975   # latitude
      # 基准点经度。
      - 119.1805795   # longitude
      # 基准点朝向，0 表示与 ENU/UTM 的默认方向对齐。
      - 0.0           # yaw [rad]

    # GPS 数据在转换前的延迟补偿时间，单位秒。
    # 如果传感器管线、串口或驱动有稳定延迟，这里可以帮助对齐时间戳。
    delay: 3.0

    # 节点处理频率，单位 Hz。
    # 影响 TF 与 GPS 相关输出的更新节奏。
    frequency: 15.0

    # 磁偏角补偿，单位弧度。
    # 若现场存在明显磁北与真北偏差，需要按实际地点修正。
    magnetic_declination_radians: 0.0

    # 是否发布由 GPS 滤波/转换后得到的观测结果。
    # 打开后可以直接给后级定位融合模块使用。
    publish_filtered_gps: true

    # 坐标变换等待时间，单位秒。
    # 当依赖的 TF 或消息未及时到达时，这个参数决定等待窗口。
    transform_timeout: 0.5

    # 是否使用本地笛卡尔坐标，而不是直接使用 UTM。
    # 当前配置选择 false，表示按 UTM/全局坐标的方式处理。
    use_local_cartesian: false

    # 是否使用里程计 yaw 参与姿态推算。
    # 开启后，节点会把里程计中的航向作为姿态来源之一参与转换。
    # 若同时启用手动 datum，地图初始朝向仍以 datum 的 yaw 为基准。
    use_odometry_yaw: true

    # 是否启用手动 datum 模式。
    # 关闭后，节点会在运行时根据首批 GPS、姿态和里程计数据自动建立全局基准。
    # 这种模式下，每次启动的全局锚点可能随首帧状态而变化。
    wait_for_datum: false

    # 额外 yaw 偏置，单位弧度。
    # 用于修正传感器安装角度、坐标系定义差异或整车基准偏差。
    yaw_offset: 0.0

    # 是否将海拔强制置零。
    # 适合只关心平面导航、且不希望高程噪声影响全局定位的场景。
    zero_altitude: true

global_ekf_node:
  ros__parameters:
    # EKF 融合频率，单位 Hz。
    # 决定状态估计输出的更新节奏。
    frequency: 15.0

    # 传感器超时阈值，单位秒。
    # 超过该时间未收到新消息时，滤波器会认为该输入暂时失效。
    sensor_timeout: 0.5

    # 是否启用 2D 模式。
    # 打开后会约束 z、roll、pitch 等维度，更适合地面车平面导航。
    two_d_mode: true

    # 是否发布 TF 变换。
    # 开启后会持续输出 map/odom/base_link 之间的位姿关系。
    publish_tf: true

    # 是否发布加速度状态。
    # 当前关闭，减少不必要的状态输出。
    publish_acceleration: false

    # 是否在计算时向当前时刻外推状态。
    # 当前关闭，优先保持估计结果保守稳定。
    predict_to_current_time: false

    # 是否打印诊断信息。
    # 打开后更方便排查传感器输入、协方差和 TF 状态。
    print_diagnostics: true

    # 地图坐标系名称。
    # 通常作为全局参考系，承载最终融合结果。
    map_frame: map

    # 里程计坐标系名称。
    # 这里承接局部连续运动，通常由轮速计或里程计链路提供。
    odom_frame: odom

    # 机器人本体坐标系名称。
    # 该坐标系通常绑定到车体几何中心或底盘参考点。
    base_link_frame: base_link

    # EKF 所使用的世界坐标系。
    # 这里设为 map，表示最终状态以全局地图系为参考。
    world_frame: map

    # TF 查询等待时间，单位秒。
    # 用于在融合过程中等待所需变换可用。
    transform_timeout: 0.5

    # --- 轮速/局部里程计输入 ---
    # 这里融合的是局部里程计 /odom 的速度和角速度，而不是绝对位置。
    # 这样可以利用其短期连续性，但避免把会漂移的位置直接当作全局真值。
    odom0: /odom

    # odom0_config 是 15 维状态选择向量，顺序通常为：
    # [x, y, z, roll, pitch, yaw,
    #  vx, vy, vz, vroll, vpitch, vyaw,
    #  ax, ay, az]
    # true 表示融合该维度，false 表示忽略该维度。
    # 当前配置只融合线速度 x/y 和角速度 yaw，避免把局部位置误当作全局位置。
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]

    # 是否把 odom0 当作差分输入。
    # false 表示输入按原始观测直接使用。
    odom0_differential: false

    # 是否把 odom0 当作相对量而非绝对量。
    # false 表示仍按原始观测处理。
    odom0_relative: false

    # odom0 输入队列长度。
    # 增大后可以缓冲一定消息抖动，但也会引入更高延迟。
    odom0_queue_size: 10

    # --- IMU 输入 ---
    # 这里假设 /imu/data 提供 ENU 姿态、角速度和原始线加速度。
    # 如果底层驱动已经去除了重力分量，需要把对应参数改掉。
    imu0: /imu/data

    # IMU 状态选择向量。
    # 当前配置融合姿态、角速度和线加速度，忽略位置和速度。
    # 这样可以让全局滤波器更好地约束朝向和动态变化。
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  true,  true]

    # 是否将 IMU 作为差分输入。
    # false 表示直接使用 IMU 的原始观测。
    imu0_differential: false

    # 是否把 IMU 作为相对量输入。
    # false 表示按绝对观测方式融合。
    imu0_relative: false

    # 是否从 IMU 线加速度中减去重力加速度。
    # 当前为 true，适用于驱动输出的是包含重力分量的原始加速度。
    imu0_remove_gravitational_acceleration: true

    # IMU 输入队列长度。
    # 与 odom 队列一样，用于平衡抖动和延迟。
    imu0_queue_size: 10

    # --- GPS 转换后的全局观测 ---
    # /odometry/gps 通常是 navsat_transform_node 输出的全局位置结果。
    # 这里仅融合 X/Y 绝对位置，用于给 EKF 提供全局漂移校正。
    odom1: /odometry/gps

    # odom1 状态选择向量。
    # 只融合平面位置 x/y，不融合姿态、速度和加速度。
    # 这样能避免 GPS 位置以外的噪声过度影响滤波器。
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]

    # 是否将 GPS 观测做差分处理。
    # false 表示使用绝对位置约束。
    odom1_differential: false

    # 是否把 GPS 观测视为相对量。
    # false 表示其作为全局绝对约束使用。
    odom1_relative: false

    # GPS 观测输入队列长度。
    # 保持与其他输入一致，避免消息堆积造成估计滞后。
    odom1_queue_size: 10
